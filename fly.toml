# fly.toml app configuration file generated for nucreo on 2025-10-16T11:12:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nucreo'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
